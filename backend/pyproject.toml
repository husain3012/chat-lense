[project]
name = "chatlens-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]
